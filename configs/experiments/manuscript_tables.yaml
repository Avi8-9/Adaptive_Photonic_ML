      phase_noise_sigma:
        start: 0.00
        stop: 0.15
        step: 0.01

      insertion_loss_db_per_mode:
        values:
          - 0.0
          - 0.5
          - 1.0
          - 1.5
          - 2.0
          - 3.0
          - 4.0
          - 5.0
