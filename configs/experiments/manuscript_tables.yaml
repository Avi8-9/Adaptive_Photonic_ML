      - MNIST
      - Fashion-MNIST
      - CIFAR-10
      - 16-QAM
    conditions:
      - clean
      - noisy

  ablation:
    title: "Ablation study"
    datasets:
      - MNIST
      - CIFAR-10
    conditions:
      - clean
      - noisy

  hardware_robustness:
